[project]
name = "recaper"
version = "0.1.0"
description = "Turn a folder of manga / manhwa chapters into a narrated recap video."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.3",
    "pymupdf>=1.24",
    "soundfile>=0.12",
    "tomli>=2.0; python_version < '3.11'",
    # Script providers (all optional at runtime; each is only imported when used)
    "claude-agent-sdk>=0.1.0",
    "google-genai>=1.0",
    "openai>=1.40",
    "ollama>=0.3",
    # Voice
    "realtimetts[playback]>=0.5",
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
kokoro = ["realtimetts[kokoro]>=0.5", "torch>=2.7", "spandrel>=0.4"]
upscale = ["torch>=2.7", "spandrel>=0.4"]  # Real-ESRGAN panel upscaling (included in kokoro)
edge = ["realtimetts[edge]>=0.5"]
coqui = ["realtimetts[coqui]>=0.5", "torch>=2.7"]
elevenlabs = ["realtimetts[elevenlabs]>=0.5"]
openai-tts = ["realtimetts[openai]>=0.5"]
system = ["realtimetts[system]>=0.5"]

[project.scripts]
recaper = "recaper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recaper"]

# CUDA build of torch (RTX 50xx / Blackwell needs cu128+) for local TTS engines.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
